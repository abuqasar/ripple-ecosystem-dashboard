 };

 }

 box.append(grid,note);
}

}
for(const [label,sub,rows] of groups){
 const lane=document.createElement('section'); lane.className='lane';
 const heading=document.createElement('div');
 const title=document.createElement('div');title.className='lane-title';title.textContent=label;
 const subtitle=document.createElement('div');subtitle.className='lane-sub text-small text-muted';subtitle.textContent=sub;
 heading.append(title,subtitle);
 const grid=document.createElement('div');grid.className='names';
 rows.forEach(row=>{const button=document.createElement('button');button.type='button';button.className='btn viz-tile';button.textContent=symbols[row[1]]+' '+row[0];button.setAttribute('aria-label',row[0]+'. '+names[row[1]]+'. '+row[2]);button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>select(row,button));buttons.push(button);grid.append(button);});
 lane.append(heading,grid);root.querySelector('#ripple-lanes').append(lane);
}
select(groups[1][2][0],buttons[7]);
})();
</script>
